[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-protocol"
version = "0.1.0"
description = "Decentralized IP Proof of Existence — stamp your ideas on Bitcoin"
authors = [{ name = "Bit Protocol contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "bitcoinlib>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]
index = [
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "aiosqlite>=0.19",
]

[project.scripts]
bit = "bit_protocol.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
