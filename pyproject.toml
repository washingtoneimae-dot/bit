[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-protocol"
version = "0.2.0"
description = "Decentralized IP Proof of Existence — stamp your ideas on Bitcoin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bit Protocol contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Version Control",
]
keywords = ["bitcoin", "ip", "timestamp", "blockchain", "op_return"]
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "bitcoinlib>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/washingtoneimae-dot/bit"
Repository = "https://github.com/washingtoneimae-dot/bit"
Documentation = "https://github.com/washingtoneimae-dot/bit#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]
index = [
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "aiosqlite>=0.19",
]

[project.scripts]
bit = "bit_protocol.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
