name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v

  build:
    name: Build package
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  stamp-release:
    name: Stamp release to Bitcoin
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bit-protocol
        run: |
          pip install -e .

      - name: Initialize key
        run: |
          bit init

      - name: Stamp release to testnet
        env:
          BIT_UTXO: ${{ secrets.BIT_UTXO }}
        run: |
          echo "Stamping release ${{ github.event.release.tag_name }}..."
          # Stamp the tag as proof this version existed
          echo "${{ github.event.release.tag_name }}" | bit stamp --text --type=source_code \
            --meta='{"repo":"bit-protocol","version":"${{ github.event.release.tag_name }}"}'
